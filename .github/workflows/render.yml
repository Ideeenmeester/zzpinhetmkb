name: Beelden maken
on:
  push:
    paths: ['posts/**', 'templates/**', 'brand/**', 'scripts/**']
  workflow_dispatch:   # handmatig starten via het tabblad Actions
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run render
      - run: pip install pillow && python3 scripts/overzicht.py
      - name: Beelden als download klaarzetten
        uses: actions/upload-artifact@v4
        with:
          name: socials
          path: output/
      - name: Beelden terugzetten in de repository
        run: |
          git config user.name "beelden-bot"
          git config user.email "beelden-bot@users.noreply.github.com"
          git add output
          git diff --cached --quiet || (git commit -m "Beelden bijgewerkt" && git push)
