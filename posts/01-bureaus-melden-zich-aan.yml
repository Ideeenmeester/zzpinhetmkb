onderwerp: "Vanaf 1 november melden bureaus zich aan. Het jouwe ook?"
linkedin: |
  Huur je mensen in via een bureau? Dan kun jij straks de boete krijgen. Niet het bureau.

  Sinds gisteren melden uitzendbureaus, detacheerders en payrollers zich aan voor de Wtta. Ze hebben tot 31 december. Wie dat mist, valt buiten de overgangsregeling.

  Vanaf 1 januari 2028 mag je alleen nog inlenen bij een uitlener met een toelating. Zit jouw bureau daar niet bij, dan klopt de Arbeidsinspectie bij jou aan.

  Bel je bureau deze week. Vraag of ze zich hebben aangemeld en laat het per mail bevestigen.

  Weet je niet eens precies met hoeveel bureaus je werkt? Dan weet je ook waar je moet beginnen.

  Bekijk onze website.
