onderwerp: "Een bureau ertussen is geen verzekering"
linkedin: |
  Een bureau ertussen voelt als een verzekering. Het is er geen.

  Veel bedrijven huren niet via een bureau in voor de werving, maar voor het gevoel dat het dan goed zit. Contract geregeld, factuur geregeld, risico weg.

  Dat laatste klopt alleen niet. De Wtta legt een eigen plicht bij de inlener: jij controleert of je uitlener een toelating heeft. En bij schijnzelfstandigheid kijkt de Belastingdienst naar hoe er echt gewerkt wordt, niet naar wie de factuur stuurt.

  Je betaalt dus elk uur een opslag voor zekerheid die je niet krijgt.

  Echte zekerheid begint bij weten hoe je samenwerking in elkaar zit. Daar heb je geen tussenpartij voor nodig. Wel overzicht.

  Bekijk onze website.
