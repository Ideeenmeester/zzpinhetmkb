linkedin: |
  Jij betaalt de marge. Jij loopt het risico. Wat doet het bureau eigenlijk nog?

  Over elk gewerkt uur gaat er een opslag naar de tussenpartij. Dat is de prijs voor gemak.

  Vanaf 1 januari 2028 moet jij controleren of die partij een Wtta-toelating heeft. Heeft hij die niet, dan kan de Arbeidsinspectie jou beboeten. Als inlener.

  Dat is een scheve deal. Als je toch zelf verantwoordelijk bent, waarom blijf je dan elk uur betalen aan iemand die die verantwoordelijkheid niet overneemt?

  Er is een andere route. Rechtstreeks samenwerken met zelfstandigen en dat goed vastleggen. Zonder marge op de uren, zonder afhankelijkheid.

  Bekijk onze website.
