onderwerp: "De zzp'er is niet het probleem. Gezag is het probleem."
linkedin: |
  Stoppen met zzp'ers uit angst voor de Belastingdienst? Dan los je het verkeerde probleem op.

  Het risico zit nooit in de zzp'er zelf. Het zit in gezag. Een zelfstandige met vaste uren, een vaste plek en een leidinggevende die hem aanstuurt zoals ieder ander in het team.

  Daar komt schijnzelfstandigheid vandaan. En met een tussenpartij erbij ook de Wtta.

  Een echte zelfstandige die een opdracht uitvoert op zijn eigen manier, tegen zijn eigen tarief en voor eigen risico, mag je gewoon inzetten. Rechtstreeks.

  Wie nu alle zzp'ers de deur wijst, verliest expertise en flexibiliteit. Wie de samenwerking goed inricht, houdt allebei.

  Bekijk onze website.
