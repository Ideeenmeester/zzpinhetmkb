onderwerp: "Hoeveel partijen leveren nu mensen aan jou?"
linkedin: |
  Hoeveel partijen leveren op dit moment mensen aan jouw bedrijf? Als je het moet opzoeken, heb je al een probleem.

  Uitzendbureaus, detacheerders, payrollers, bemiddelaars. Daarnaast de zzp'ers die rechtstreeks voor je werken. Bij de meeste mkb-bedrijven is dat per afdeling gegroeid. Elke manager zijn eigen bureau, zijn eigen afspraken.

  Tot nu toe was dat vooral onhandig. Straks moet je voor elke uitlener op die lijst kunnen aantonen dat hij een toelating heeft. En voor elke zzp'er dat hij echt zelfstandig werkt.

  Certificaten in mailboxen en afspraken in iemands hoofd houden dat niet vol.

  Begin met één lijst. Wie werkt er, via wie, en op basis waarvan.

  Bekijk onze website.
