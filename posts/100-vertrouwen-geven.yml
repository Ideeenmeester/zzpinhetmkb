onderwerp: "Geen gezag betekent ook: vertrouwen geven"
linkedin: |
  Geen gezag. Voor veel ondernemers klinkt dat als controle uit handen geven. Het is eigenlijk vertrouwen geven.

  Je huurt een zelfstandige in omdat hij iets kan wat jij nodig hebt. Zijn vakmanschap, zijn ervaring, zijn manier van werken. Dan is het logisch dat hij zelf bepaalt hoe hij het aanpakt.

  Jij bepaalt het resultaat, de kwaliteit en de deadline. Daar mag je streng op zijn.

  Die verdeling is niet alleen prettiger voor beide kanten. Het is ook precies wat zelfstandig werk zelfstandig maakt. En wie zelfstandig werkt, leen je niet in.

  Vertrouwen blijkt hier de veiligste keuze.

  Bekijk onze website.
