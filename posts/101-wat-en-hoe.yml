onderwerp: "De zzp'er bepaalt hoe, jij bepaalt wat"
linkedin: |
  Jij bepaalt wat. De zzp'er bepaalt hoe. Meer spelregels heb je eigenlijk niet nodig.

  Wat: het resultaat, de kwaliteit, de deadline, de prijs. Daar maak je samen heldere afspraken over.

  Hoe: de werkwijze, de volgorde, de methode, het gereedschap. Dat laat je aan de vakman.

  Wie die verdeling aanhoudt, werkt met een ondernemer en niet met een werknemer op factuur. Dan speelt de Wtta niet en sta je sterk als iemand naar de praktijk vraagt.

  In zzpinhetmkb leg je dat per opdracht vast. Zo is het niet alleen goed geregeld, je kunt het ook laten zien.

  Bekijk onze website.
