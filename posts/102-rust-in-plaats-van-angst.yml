onderwerp: "Rust in plaats van angst voor controles"
linkedin: |
  Je hoeft niet wakker te liggen van een controle. Als je weet hoe je samenwerkt en het kunt laten zien.

  Veel ondernemers worden onrustig van de berichten over handhaving. De Belastingdienst kijkt weer naar schijnzelfstandigheid, en vanaf 2028 controleert de Arbeidsinspectie ook inleners.

  Rust komt niet van een bureau dat zegt dat het goed zit. Rust komt van overzicht. Per zzp'er een dossier met KvK, certificaten en verzekeringen. Per opdracht vastgelegd waarom het zelfstandig werk is. En een seintje als er iets dreigt te verlopen.

  Dan is een vraag van een controleur gewoon een vraag. Geen paniek.

  Bekijk onze website.
