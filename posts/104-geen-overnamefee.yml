onderwerp: "Opdracht klaar? Geen overnamefee, geen beding"
linkedin: |
  De opdracht is klaar en je wilt verder met dezelfde zzp'er. Bij veel bureaus begint dan het rekenen.

  Een overnamefee als je hem in dienst wilt nemen. Een concurrentiebeding als je hem rechtstreeks wilt inhuren. Een periode waarin het allebei niet mag.

  Bij zzpinhetmkb bestaat dat allemaal niet. Je hebt de zzp'er niet via ons gekocht. Jullie werken gewoon samen, op basis van een overeenkomst tussen jullie tweeën.

  Wil je verder? Dan ga je verder. Wil je hem een contract aanbieden? Dan doe je dat. Niemand die daar iets voor rekent.

  Bekijk onze website.
