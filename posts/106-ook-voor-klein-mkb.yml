  Drie medewerkers en twee vaste zzp'ers. Is dit dan ook iets voor jou? Juist wel.

  Grote organisaties hebben een inkoopafdeling en een jurist. Kleine bedrijven hebben de ondernemer zelf, die alles erbij doet. Daar is goed regelen het lastigst, en daar is een fout het duurst.

  Zzpinhetmkb is daarom simpel opgezet. Eén licentie van €9,99 per maand voor je bedrijf, €4,95 per lopende overeenkomst. Met twee zzp'ers ben je dus minder dan €20 per maand kwijt.

  Daarvoor heb je per zzp'er een dossier, per opdracht de afspraken vastgelegd en een seintje als er iets verloopt. Over drie dagen gaat de Wtta in. Jij hoeft daar niet van wakker te liggen.

  Bekijk onze website.
