onderwerp: "Wat de zzp'er eraan heeft"
linkedin: |
  Een zzp'er die rechtstreeks werkt, houdt meer over. En jij betaalt minder. Die rekensom klopt voor beide kanten.

  Wat heeft de zzp'er nog meer aan zzpinhetmkb? Hij betaalt niets voor deelname. Hij bepaalt zelf zijn tarief. Er gaat geen percentage van zijn uren af. En hij werkt rechtstreeks met de opdrachtgever, zonder iemand ertussen die meebeslist.

  Daarnaast staat zijn dossier op orde. KvK, registraties, certificaten en verzekeringen op één plek. Dat maakt het voor nieuwe opdrachtgevers makkelijker om met hem in zee te gaan.

  Een goede samenwerking begint bij twee tevreden partijen.

  Bekijk onze website.
