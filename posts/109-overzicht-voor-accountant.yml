linkedin: |
  Je accountant vraagt hoeveel je vorig jaar aan externe inzet hebt uitgegeven. Hoe lang ben je aan het zoeken?

  Bij veel bedrijven komt dat antwoord uit tientallen facturen, verspreid over afdelingen en leveranciers. En dan weet je nog niet op basis van welke afspraken er gewerkt is.

  In zzpinhetmkb staat het bij elkaar. Welke zelfstandigen er werken, welke overeenkomsten lopen, wat ze kosten. Per opdracht vastgelegd en maandelijks bijgewerkt.

  Dat is handig voor je accountant of controller. En het is precies wat je wilt kunnen laten zien als de Belastingdienst vraagt hoe je met zzp'ers samenwerkt.

  Weet wie er werkt, wat het kost en of het klopt.

  Bekijk onze website.
