onderwerp: "Detachering is niet automatisch veilig"
linkedin: |
  "Wij werken alleen met een detacheerder, dus de Wtta gaat niet over ons." Helaas wel.

  Detacheren klinkt anders dan uitzenden. Hoger opgeleid, langere opdrachten, vaak iemand in vaste dienst bij de detacheerder. Voor de Wtta maakt dat niets uit.

  Laat een detacheerder iemand bij jou werken onder jouw leiding en toezicht? Dan is dat terbeschikkingstelling. Die detacheerder heeft dus een toelating nodig, en jij moet dat kunnen laten zien.

  Juist bij detachering gaat het vaak om mensen die al jaren bij je zitten. Projectleiders, IT'ers, specialisten. Precies de mensen die je niet van de ene op de andere dag kwijt wilt.

  Zet je detacheerders op dezelfde lijst als je uitzendbureaus.

  Bekijk onze website.
