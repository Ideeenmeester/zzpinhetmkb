linkedin: |
  Geen raamcontract. Geen minimale afname. Geen opzegtermijn van een jaar.

  Wie met een bureau werkt, zit vaak vast aan afspraken die ooit voor de zekerheid zijn gemaakt. Een minimum aantal uren, een vaste leverancier, een contract dat stilzwijgend verlengt.

  Bij zzpinhetmkb betaal je per maand. Een licentie voor je bedrijf en een klein bedrag per lopende overeenkomst. Loopt er deze maand niets, dan betaal je alleen de licentie.

  Zo houd je je externe inzet flexibel, precies zoals externe inzet bedoeld is. Je flexibele schil groeit mee met je werk, niet met een contract.

  Bekijk onze website.
