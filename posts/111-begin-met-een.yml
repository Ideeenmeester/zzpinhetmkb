  Je hoeft niet morgen je hele externe inzet om te gooien. Begin met één zzp'er.

  Kies iemand met wie je al goed samenwerkt. Spreek een duidelijke opdracht af, met een resultaat en een prijs. Sluit de overeenkomst rechtstreeks. Zet zijn dossier op orde.

  Zo zie je in een paar weken hoe het werkt. Wat het kost, hoeveel tijd het scheelt en hoe prettig het is als er niemand tussen zit.

  Bevalt het, dan breid je uit. Bevalt het niet, dan ben je €9,99 en €4,95 per maand kwijt geweest. Een kleine stap met weinig risico.

  Bekijk onze website.
