onderwerp: "De scan als eerste stap"
linkedin: |
  Drie minuten. Langer duurt het niet om te zien hoe jouw externe inzet ervoor staat.

  De scan op onze website stelt een paar vragen. Met hoeveel externen werk je, via welke route, en hoe zijn de afspraken vastgelegd? Daarna zie je waar je risico loopt en waar je kunt besparen.

  Het is geen juridisch oordeel. Het is een eerste blik die je helpt om te bepalen wat je volgende stap is. Voor de een is dat een paar overeenkomsten aanscherpen, voor de ander het hele inhuurbeleid.

  Van vraagteken naar uitroepteken begint hier.

  Bekijk onze website.
