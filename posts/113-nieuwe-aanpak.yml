onderwerp: "Nieuw jaar, nieuwe aanpak voor externe inzet"
linkedin: |
  Januari is bijna voorbij. Is je externe inzet dit jaar anders geregeld dan vorig jaar?

  De Wtta geldt sinds 1 januari. Over elf maanden handhaaft de Arbeidsinspectie ook bij inleners. Een goed moment om niet alleen je bureaus te controleren, maar ook te kijken of het anders kan.

  Want voor veel werk heb je geen uitlener nodig. Een zelfstandige die een opdracht uitvoert op zijn eigen manier, leen je niet in. Daar komt geen toelating aan te pas.

  Met zzpinhetmkb regel je dat rechtstreeks. Zonder afhankelijkheid, met overzicht en tegen een vast bedrag per maand.

  Nieuw jaar, nieuwe aanpak.

  Bekijk onze website.
