onderwerp: "Zelfstandig blijft zelfstandig: zo borg je dat"
linkedin: |
  Een zzp'er is zelfstandig op de dag dat hij begint. Dat moet hij ook blijven, ook na een jaar.

  Het risico zit in de gewenning. Na een paar maanden schuift hij aan bij het teamoverleg, krijgt hij een laptop van de zaak en staat hij op het rooster. Niemand heeft dat bewust besloten.

  Daarom helpt het om het vast te leggen en te blijven volgen. In zzpinhetmkb staat per opdracht waarom het zelfstandig werk is. De overeenkomst wordt maandelijks bijgewerkt, zodat je ziet of de praktijk nog past bij de afspraken.

  Zo blijft zelfstandig ook echt zelfstandig.

  Bekijk onze website.
