onderwerp: "Software zonder commercieel belang"
linkedin: |
  Software hoeft niet mee te verdienen aan jouw samenwerking. Dat is precies het punt.

  Een bureau is een commerciële partij met een eigen belang: meer uren, langere opdrachten, een hogere marge. Dat is niet slecht, het is gewoon hoe zo'n bedrijf werkt.

  Zzpinhetmkb is software. We leveren overzicht, dossiers, overeenkomsten en ondersteuning. We kiezen niet welke zzp'er je inhuurt, we bepalen geen tarief en we hebben er geen belang bij hoe lang een opdracht duurt.

  Daardoor kunnen we eerlijk zijn over wat goed geregeld is. Voor de opdrachtgever en voor de zzp'er.

  Bekijk onze website.
