  De meeste problemen met zzp'ers ontstaan niet door de wet. Ze ontstaan door vage afspraken.

  Niemand wist precies wat er af moest zijn. Het tarief werd per mail afgesproken. De overeenkomst lag ergens in een map, en de praktijk was inmiddels heel anders.

  Duidelijke afspraken voorkomen dat gedoe. Een opdracht met een resultaat. Een prijs die beide kanten kennen. Een overeenkomst die past bij hoe er echt gewerkt wordt.

  In zzpinhetmkb staat dat allemaal op één plek, en de overeenkomst wordt maandelijks bijgewerkt. Klaar als iemand ernaar vraagt.

  Bekijk onze website.
