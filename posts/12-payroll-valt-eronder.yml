onderwerp: "Payroll valt er ook onder"
linkedin: |
  Jij vond de medewerker. Jij stuurt hem aan. Toch valt hij onder de Wtta.

  Payrolling voelt als administratie. Het payrollbedrijf regelt de loonstrook, jij doet de rest.

  Juridisch is het payrollbedrijf de werkgever die de medewerker aan jou ter beschikking stelt. Dat is uitlenen. Dus ook je payroller heeft een toelating nodig, en vanaf 1 januari 2028 moet jij kunnen aantonen dat hij die heeft.

  Veel ondernemers vergeten payroll als ze aan de Wtta denken. Juist omdat het zo vanzelf gaat.

  Weet je precies wie er bij jou via payroll werkt, en bij welk bedrijf? Dan ben je al verder dan de meeste.

  Bekijk onze website.
