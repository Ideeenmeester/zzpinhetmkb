linkedin: |
  Het certificaat van je installateur verliep drie maanden geleden. Niemand had het gezien.

  Zo gaat dat als papieren in mailboxen en mappen zitten. Tot er iets misgaat, of iemand ernaar vraagt.

  In zzpinhetmkb heeft elke zzp'er één dossier. KvK-gegevens, registraties, certificaten, verzekeringen en verklaringen staan bij elkaar. Nadert een verloopdatum, dan krijg je vooraf een seintje.

  Geen agenda vol herinneringen. Geen gezoek als een klant of je accountant om een bewijs vraagt.

  De zzp'er levert zijn gegevens zelf aan in zijn profiel. Jij ziet in één oogopslag of het klopt.

  Bekijk onze website.
