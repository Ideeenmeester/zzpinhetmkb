onderwerp: "Hoe het in het onderwijs al negen jaar werkt"
linkedin: |
  Scholen werken al negen jaar rechtstreeks met zelfstandige onderwijsprofessionals. Zonder commerciële tussenpartij.

  Dat begon met Flexonderwijs en een simpele gedachte: als een school en een zelfstandige elkaar kunnen vinden, heldere afspraken maken en het netjes vastleggen, wat voegt een bureau dan nog toe?

  Het antwoord bleek: weinig. Scholen hielden geld over. Zelfstandigen hielden hun eigen tarief. En iedereen wist precies waar hij aan toe was.

  Met zzpinhetmkb brengen we diezelfde werkwijze naar het mkb, als onderdeel van Zoriva. Andere sector, dezelfde aanpak. Geen strijkstok, wel overzicht en goede afspraken.

  Bekijk onze website.
