onderwerp: "Wat het je oplevert: geld, tijd en rust"
linkedin: |
  Drie dingen die je terugkrijgt als je de tussenpartij weglaat.

  Geld. Er gaat geen percentage meer af van elk gewerkt uur. Je betaalt €9,99 per maand en €4,95 per lopende overeenkomst. Wat je met de zzp'er afspreekt, is wat je hem betaalt.

  Tijd. Geen raamcontracten, geen leveranciersoverleg, geen zoektocht door mailboxen. Alle zelfstandigen, overeenkomsten en dossiers staan op één plek.

  Rust. Je weet wie er voor je werkt, op basis van welke opdracht, en dat het zo is vastgelegd dat het klopt met de praktijk.

  Het zijn geen grote beloftes. Het is gewoon wat er overblijft als niemand meer aan je samenwerking verdient.

  Bekijk onze website.
