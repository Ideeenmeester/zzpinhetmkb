  Stel dat je morgen met zzpinhetmkb stopt. Wat raak je dan kwijt?

  Niets. Je zzp'ers blijven gewoon je zzp'ers. De overeenkomsten waren al rechtstreeks tussen jou en hen. Er is geen beding dat je verbiedt verder te werken met mensen die je kent, en niemand vraagt een overnamefee als je iemand in dienst wilt nemen.

  Dat is precies het punt. Software hoort je werk makkelijker te maken, niet je relaties over te nemen.

  Wij verdienen geen percentage aan je uren. We hebben er dus ook geen belang bij je vast te houden. Je blijft omdat het werkt, of je gaat. Allebei prima.

  Bekijk onze website.
