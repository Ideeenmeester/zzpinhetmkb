  Een goede samenwerking met een zzp'er lijkt meer op die met je accountant dan op die met je personeel.

  Jij weet wat je nodig hebt. Hij weet hoe je daar komt. Jullie spreken samen af wat het mag kosten en wanneer het klaar is.

  Daar hoort geen partij tussen die bepaalt wat de zzp'er krijgt en wat jij betaalt. Zo'n partij haalt de gelijkwaardigheid er juist uit.

  Bij zzpinhetmkb sluiten opdrachtgever en opdrachtnemer de overeenkomst rechtstreeks met elkaar. Met respect voor wat ieder inbrengt: jouw opdracht, zijn vakmanschap.

  Twee ondernemers die zaken doen. Zo simpel mag het zijn.

  Bekijk onze website.
