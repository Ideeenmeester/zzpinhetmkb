onderwerp: "Rechtstreeks schakelt sneller"
linkedin: |
  Maandag valt er iemand uit, dinsdag staat er een vakman. Dat lukt alleen als er niemand tussen jou en de zzp'er zit.

  Via een tussenpartij maakt elke vraag een omweg. Jij belt het bureau, het bureau belt de zzp'er, en het antwoord komt dezelfde weg terug. Over het tarief, over verlenging, over een kleine wijziging in de opdracht.

  Rechtstreeks werken haalt die omweg eruit. Je spreekt de zelfstandige zelf, je past de afspraak samen aan en je legt het vast in zzpinhetmkb. Klaar.

  Snelheid is geen luxe als je klanten op je wachten. Het is gewoon wat er gebeurt als je de tussenstap weglaat.

  Bekijk onze website.
