onderwerp: "Iemand onder je leiding nodig? Dan eerlijk kiezen"
linkedin: |
  Niet elke klus hoort bij een zzp'er. Dat zeggen wij gewoon hardop.

  Heb je iemand nodig die je dagelijks aanstuurt, op jouw tijden en volgens jouw werkwijze? Neem diegene dan in dienst. Is het tijdelijk en komt die persoon via een andere partij? Werk dan met een uitlener die een toelating heeft, want vanaf 2028 moet dat.

  Maar heel veel werk is gewoon een opdracht. Een installatie, een project, een advies, een website. Afgebakend, met een resultaat, uitgevoerd door iemand die zelf bepaalt hoe.

  Voor dat werk is zzpinhetmkb. Rechtstreeks, zonder gezag en goed vastgelegd. Eerlijk kiezen per situatie geeft de meeste rust.

  Bekijk onze website.
