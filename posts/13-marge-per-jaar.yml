onderwerp: "Wat kost 20% marge je per jaar?"
linkedin: |
  €75.000 per jaar. Zoveel betaal je aan opslag voor vijf externe professionals. Zonder dat je er iets extra's voor terugkrijgt.

  Reken mee. Vijf mensen, elk 1.000 uur per jaar, gemiddeld €75 per uur. Een tussenpartij rekent 20 procent bovenop. Dat is €15.000 per persoon.

  Wat koop je daarmee? Een factuur, een contract en het gevoel dat het geregeld is. De Wtta laat zien dat de verantwoordelijkheid gewoon bij jou blijft.

  Werving van schaarse profielen kost tijd en geld. Daar mag een bureau voor betaald worden.

  Ken je die mensen al? Dan betaal je elk jaar opnieuw voor een dienst die je niet meer gebruikt.

  Bekijk onze website.
