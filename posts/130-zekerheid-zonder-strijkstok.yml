onderwerp: "Zekerheid zonder strijkstok"
linkedin: |
  Je hoeft niet te kiezen tussen zekerheid en eerlijke kosten. Dat is jarenlang wel zo verkocht.

  De gedachte was: wil je het goed geregeld hebben, dan betaal je een tussenpartij een percentage op elk uur. Maar die tussenpartij verdient meer naarmate de zzp'er langer en meer werkt. Dat is geen neutrale positie.

  Zekerheid komt uit iets anders. Uit een duidelijke opdracht. Uit een overeenkomst die past bij hoe er echt gewerkt wordt. Uit een dossier dat compleet is en bijblijft.

  Dat regel je in zzpinhetmkb. Voor een vast bedrag per maand, zonder dat iemand aan je samenwerking verdient.

  Bekijk onze website.
