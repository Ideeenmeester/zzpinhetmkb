onderwerp: "Van vraagteken naar uitroepteken"
linkedin: |
  Werkt mijn zzp'er eigenlijk zelfstandig genoeg? Moet ik iets met de Wtta? Wat kost al die externe inzet ons samen?

  Veel ondernemers lopen met dit soort vragen rond. Niet omdat ze het slecht doen, maar omdat niemand het ooit op een rij heeft gezet.

  Die vragen verdwijnen niet vanzelf. Ze worden wel een stuk kleiner zodra je overzicht hebt. Wie werkt er, op basis van welke opdracht, tegen welk tarief, en staat alles goed vastgelegd?

  Met zzpinhetmkb ga je van vraagteken naar uitroepteken. Begin met de scan van je externe inzet. Drie minuten, en je weet waar je staat.

  Bekijk onze website.
