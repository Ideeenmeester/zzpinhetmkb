linkedin: |
  Zelf regelen klinkt als meer werk. In de praktijk is het vaak minder.

  Via een tussenpartij beheer je eigenlijk twee relaties: die met de zzp'er en die met het bureau. Twee contracten, twee contactpersonen, en een factuur waarop je niet precies ziet wat waarheen gaat.

  Rechtstreeks heb je er één. Je spreekt de opdracht af met de zelfstandige, je sluit samen de overeenkomst en zzpinhetmkb houdt het overzicht bij. Dossiers, verloopdatums, vastlegging per opdracht.

  Je houdt de regie zonder dat je er een dagtaak aan hebt. En je ziet altijd precies wat het kost.

  Regel het zelf, met overzicht en inzicht op je externe inzet.

