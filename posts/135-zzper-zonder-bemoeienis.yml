onderwerp: "Voor zzp'ers: ingezet worden zonder commerciële bemoeienis"
linkedin: |
  Zzp'er? Dan ken je het: een platform of bureau dat meepraat over je tarief en elke maand een deel van je omzet houdt.

  Bij zzpinhetmkb betaal je als zelfstandige niets. Geen inschrijfgeld, geen abonnement, geen percentage. Je spreekt je tarief rechtstreeks af met de opdrachtgever en dat bedrag is van jou.

  Je profiel en je gegevens beheer je zelf. KvK, registraties, certificaten en verzekeringen lever je één keer aan, en opdrachtgevers zien direct dat het klopt. Dat maakt het voor hen makkelijker om met je in zee te gaan.

  Je blijft ondernemer. Wij zorgen dat de afspraken goed vastliggen.

  Bekijk onze website.
