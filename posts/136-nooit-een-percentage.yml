onderwerp: "Onze belofte: nooit een percentage"
linkedin: |
  Hoe groter je zzp-inzet, hoe meer een tussenpartij verdient. Bij ons werkt dat niet zo, en dat blijft zo.

  Zzpinhetmkb rekent geen percentage over gewerkte uren. Nooit. Je betaalt een licentie per maand en een vast bedrag per lopende overeenkomst. Of je zzp'er nu tien uur werkt of duizend.

  Dat is geen actie of introductieprijs. Het is de kern van hoe we werken. Zodra je aan de uren van een ander verdient, heb je er belang bij dat die uren groeien. Wij willen alleen dat het goed geregeld is.

  We verdienen niets extra als jij meer uren inkoopt. Daarom kun je ons vertrouwen met je externe inzet.

  Bekijk onze website.
