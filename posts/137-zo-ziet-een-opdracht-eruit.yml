onderwerp: "Zo ziet een opdracht eruit"
linkedin: |
  Een goed geregelde zzp-opdracht past op één A4. Zo ziet hij eruit.

  Eerst het resultaat. Wat moet er klaar zijn en waaraan zie je dat het goed is? Geen uren per week, maar een uitkomst.

  Dan de afspraken. De prijs die jullie samen bepalen, de planning, en wat er gebeurt als iets niet goed gaat. De zzp'er bepaalt zelf hoe hij het werk aanpakt.

  Daarna leg je het vast in zzpinhetmkb. De overeenkomst staat rechtstreeks tussen jullie, en per opdracht wordt vastgelegd waarom het zelfstandig werk is.

  Tot slot het dossier: KvK, registraties, certificaten en verzekeringen op één plek.

  Meer is het niet.

  Bekijk onze website.
