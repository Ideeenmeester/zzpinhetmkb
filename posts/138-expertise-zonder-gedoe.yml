onderwerp: "Expertise inhuren zonder gedoe"
linkedin: |
  Je hebt een specialist nodig voor zes weken. Waarom voelt dat als een juridisch project?

  Omdat er de laatste jaren vooral angst is verkocht. Over schijnzelfstandigheid, over de Wtta, over controles. Met als boodschap: laat het maar via een bureau lopen.

  Maar expertise inhuren is in de kern simpel. Je zoekt iemand die iets kan wat jij niet in huis hebt. Je spreekt af wat het moet opleveren. Hij doet het op zijn manier.

  Precies dat soort opdrachten past bij zelfstandig ondernemerschap. Zonder gezag, dus zonder inlenen. Met zzpinhetmkb leg je het in een paar stappen vast en houd je het overzicht.

  Het kan gewoon.

  Bekijk onze website.
