onderwerp: "Extra krachten in drukke tijden, goed geregeld"
linkedin: |
  De drukte komt elk jaar. Waarom begin je dan elk jaar opnieuw met zoeken?

  Veel bedrijven vangen pieken op met extra krachten via een bureau. Dat werkt, maar na de piek verdwijnen de mensen weer uit beeld. Volgend jaar begint het verhaal opnieuw, met nieuwe gezichten en dezelfde opslag.

  Rechtstreeks werken met zelfstandigen draait dat om. De vakmensen die het dit voorjaar goed deden, staan in je eigen overzicht. Hun dossier is compleet. Volgend jaar bel je ze gewoon weer.

  Spreek per piek een afgebakende opdracht af en laat ze zelf het werk inrichten. Zo blijft het zelfstandig en bouw je ondertussen aan een vaste flexibele schil.

  Bekijk onze website.
