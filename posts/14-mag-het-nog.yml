onderwerp: "Mag je nog met zzp'ers werken? Ja."
linkedin: |
  Mag je nog met zzp'ers werken? Ja. Wie iets anders beweert, wil je waarschijnlijk iets verkopen.

  Er is geen verbod. Wat niet mag: iemand als zelfstandige laten werken terwijl hij in de praktijk werknemer is. Daar handhaaft de Belastingdienst sinds 2025 weer op.

  Het verschil zit in hoe je samenwerkt. Spreek je een resultaat af of koop je uren? Bepaalt de zzp'er zelf hoe hij werkt? Loopt hij ondernemersrisico? Werkt hij ook voor anderen?

  Wie dat goed inricht, kan gewoon rechtstreeks met zelfstandigen werken. Geen trucje. Gewoon ondernemen met ondernemers.

  Bekijk onze website.
