onderwerp: "Een flexibele schil die van jou is"
linkedin: |
  Een flexibele schil is pas flexibel als jij hem in handen hebt.

  Loopt al je externe inzet via één bureau, dan is je schil eigenlijk van hen. Zij hebben de contacten, de contracten en de voorwaarden. Valt het bureau weg of verandert het de prijs, dan sta jij stil.

  Een eigen schil bouw je met zelfstandigen die je kent en met wie je rechtstreeks afspraken maakt. In zzpinhetmkb staan ze bij elkaar, met hun dossier en hun eerdere opdrachten.

  Geen beding dat je tegenhoudt, geen fee als je iemand langer wilt houden. Je schil groeit met je bedrijf mee, en hij blijft van jou.

  Bekijk onze website.
