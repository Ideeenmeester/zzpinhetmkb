linkedin: |
  Terwijl uitzendbureaus deze weken hun toelating aanvragen, kun jij er rustig naar kijken.

  Vanaf 1 januari 2028 mag je alleen nog inlenen bij uitleners met een toelating, en de Arbeidsinspectie gaat dat controleren. Voor bedrijven die veel via bureaus werken, betekent dat checken, vastleggen en hopen dat hun partij het haalt.

  Werk je rechtstreeks met zelfstandigen die zonder gezag een opdracht uitvoeren, dan leen je niet in. Daar hoeft geen toelating bij gecontroleerd te worden.

  Wat je wel nodig hebt: opdrachten die echt zelfstandig zijn en goed vastgelegd. Dat regel je in zzpinhetmkb. Dan kun je 2028 met rust tegemoet zien.

  Bekijk onze website.
