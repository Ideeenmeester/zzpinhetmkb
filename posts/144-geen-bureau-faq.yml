onderwerp: "Is dit niet gewoon weer een bureau?"
linkedin: |
  "Is zzpinhetmkb niet gewoon weer een bureau?" Nee. En het verschil zit in waar het geld zit.

  Een bureau sluit contracten met jou en met de zzp'er, praat mee over het tarief en verdient aan elk uur dat er gewerkt wordt. Het staat tussen jullie in.

  Zzpinhetmkb staat ernaast. Jij en de zelfstandige sluiten de overeenkomst rechtstreeks met elkaar. Jullie bepalen samen het tarief. Wij leveren de software en de ondersteuning om het goed te regelen: overzicht, dossiers, vastlegging per opdracht.

  Je betaalt ons €9,99 per maand en €4,95 per lopende overeenkomst. De zzp'er betaalt niets. Geen percentage, geen overnamefee, geen concurrentiebeding.

  Wij verdienen dus niet meer als jullie meer uren maken. Dat is het hele verschil.

  Bekijk onze website.
