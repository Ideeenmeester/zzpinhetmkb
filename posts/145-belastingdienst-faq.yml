onderwerp: "En als de Belastingdienst vragen stelt?"
linkedin: |
  "En als de Belastingdienst vragen stelt over mijn zzp'ers?" Dan laat je zien hoe je samenwerkt. Daarom leg je het vast.

  Bij schijnzelfstandigheid kijkt de Belastingdienst naar de praktijk. Werkt iemand echt zelfstandig, met een eigen opdracht, een eigen werkwijze en eigen risico? Of is hij in feite gewoon werknemer?

  Hoe beter je dat kunt onderbouwen, hoe sterker je staat. In zzpinhetmkb staat per opdracht wat er is afgesproken en waarom het zelfstandig werk is. Daarnaast de overeenkomst, maandelijks bijgewerkt, en het dossier van de zzp'er.

  Een garantie is dat niet: het gaat er altijd om dat de praktijk klopt met de afspraken. Maar je hoeft niet te zoeken, en je kunt het uitleggen.

  Bekijk onze website.
