onderwerp: "Betaalt de zzp'er ook iets?"
linkedin: |
  Nee. De zzp'er betaalt niets. Niet voor het aanmelden, niet per opdracht en niet per uur.

  Dat is een bewuste keuze. Zodra je de zelfstandige laat betalen, gaat er weer een stukje van zijn tarief naar een derde partij. Precies dat willen we niet.

  De opdrachtgever betaalt €9,99 per maand en €4,95 per lopende overeenkomst. Wat de opdrachtgever en de zzp'er met elkaar afspreken, gaat volledig naar de zzp'er.

  Zo blijft het tarief wat het hoort te zijn: de prijs die een ondernemer zelf voor zijn werk vraagt.

  Bekijk onze website.
