onderwerp: "Ondernemers onder elkaar"
linkedin: |
  Een mkb-ondernemer en een zzp'er hebben meer gemeen dan je zou denken.

  Allebei dragen ze hun eigen risico. Allebei willen ze een eerlijke prijs voor goed werk. Allebei hebben ze een hekel aan partijen die meepraten zonder mee te werken.

  Waarom zou je dan een derde partij nodig hebben om samen zaken te doen? Twee ondernemers kunnen prima zelf afspreken wat er moet gebeuren, wat het kost en wanneer het klaar is.

  Wat helpt, is dat het goed vastligt. Een duidelijke opdracht, een overeenkomst rechtstreeks tussen jullie, en een dossier dat compleet is. Dat regel je in zzpinhetmkb, met respect voor allebei.

  Bekijk onze website.
