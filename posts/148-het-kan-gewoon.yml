linkedin: |
  Rechtstreeks werken met zelfstandigen, goed geregeld en zonder strijkstok. Het kan gewoon.

  De afgelopen maanden lieten we zien hoe. Een opdracht met een duidelijk resultaat. Een zzp'er die zelf bepaalt hoe hij het werk doet. Een overeenkomst rechtstreeks tussen jullie. En alles vastgelegd op één plek, zodat je het kunt laten zien.

  Zonder gezag leen je niet in, en dan speelt de Wtta niet. Zonder tussenpartij betaal je geen percentage. Zonder beding blijf je vrij.

  Wat overblijft is wat samenwerken hoort te zijn: transparant, met respect voor opdrachtgever en opdrachtnemer.

  Bekijk onze website.
