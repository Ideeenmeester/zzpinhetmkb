onderwerp: "Wat de Wtta niet is"
linkedin: |
  De Wtta is geen zzp-verbod. Toch doen veel bedrijven alsof het er een is.

  Drie dingen die de Wtta niet is. Geen verbod op zelfstandigen. Geen nieuwe toets op schijnzelfstandigheid. Geen regel die alleen voor grote bedrijven geldt.

  De wet gaat over uitlenen: partijen die mensen aan jou ter beschikking stellen om onder jouw leiding te werken.

  Een zelfstandige die rechtstreeks een opdracht bij je uitvoert, op zijn eigen manier en zonder dat jij hem aanstuurt, wordt niet uitgeleend. Daar is geen toelating voor nodig.

  Precies daar zit voor veel mkb-bedrijven de ruimte. Als je het goed regelt.

  Bekijk onze website.
