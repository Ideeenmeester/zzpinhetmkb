onderwerp: "Schijnzelfstandigheid in één vraag"
linkedin: |
  Zou een buitenstaander het verschil zien tussen jouw zzp'er en je eigen medewerkers?

  Zelfde uren. Zelfde teamoverleg. Zelfde laptop. Zelfde leidinggevende. Dan lijkt het al snel op een dienstverband, hoe het contract ook heet.

  En dat kan je duur komen te staan. De Belastingdienst kan loonheffingen naheffen over de periode waarin het niet klopte.

  Zie je wel een duidelijk verschil? Een eigen werkwijze, een eigen tarief, eigen risico, meerdere opdrachtgevers? Dan sta je een stuk sterker.

  Over schijnzelfstandigheid zijn boeken vol geschreven. In de praktijk begint het met die ene vraag.

  Bekijk onze website.
