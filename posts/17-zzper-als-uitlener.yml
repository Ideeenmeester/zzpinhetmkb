onderwerp: "Ook een zzp'er kan uitlener worden"
linkedin: |
  Je zzp'er met een eigen bv kan onder de Wtta gewoon als uitlener gelden. Dat weten de meeste opdrachtgevers niet.

  Het draait weer om leiding en toezicht. Wie zelf bepaalt hoe hij een afgesproken resultaat bereikt, is geen uitlener. Stuurt de opdrachtgever het werk aan, dan kan die bv wel als uitlener worden gezien. De rechtsvorm maakt niet uit, een tussenpartij ook niet.

  Zet je zzp'ers in als extra handen in het team? Dan loop je een dubbel risico: schijnzelfstandigheid én de Wtta.

  Zet je ze in als ondernemers, met een opdracht en eigen regie? Dan heb je dat probleem niet.

  Het verschil zit in hoe je het regelt.

  Bekijk onze website.
