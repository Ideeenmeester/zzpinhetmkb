  Drie vragen. Eén mail. Bijna niemand stuurt hem.

  Werk je met een uitzendbureau, detacheerder of payroller? Vraag ze deze maand nog, per mail:

  1. Hebben jullie je aangemeld voor de overgangsregeling van de Wtta? Dat moet uiterlijk 31 december.
  2. Wanneer vragen jullie de toelating aan, en verwachten jullie ontheffing van de waarborgsom?
  3. Wat gebeurt er met onze mensen als jullie geen toelating krijgen?

  Een goed bureau heeft die antwoorden klaarliggen.

  Krijg je een vaag antwoord? Dan weet je in elk geval waar je risico zit.

  Bekijk onze website.
