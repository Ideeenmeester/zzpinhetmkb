  Nog zeventien dagen. Dan sluit de aanmelding voor de overgangsregeling van de Wtta.

  Uitleners die zich uiterlijk 31 december aanmelden en aan de voorwaarden voldoen, mogen doorwerken terwijl de NAU hun aanvraag beoordeelt. Wie het mist, valt buiten die regeling.

  De grote uitzendbureaus hebben dit vast keurig geregeld. Maar werk je met een kleine detacheerder, een regionaal bureau of een bemiddelaar die het allemaal nog even bekijkt?

  Bel ze. Deze week.

  Missen zij de boot, dan zit jij straks met mensen die je niet meer mag inlenen.

  Bekijk onze website.
