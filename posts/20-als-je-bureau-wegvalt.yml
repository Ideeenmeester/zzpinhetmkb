onderwerp: "Wat als jouw bureau het niet redt?"
linkedin: |
  Je beste externe kracht kan op 1 januari 2028 zomaar weg zijn. Zonder dat hij zelf iets fout deed.

  Niet elk bureau haalt de Wtta. Een waarborgsom van €100.000, een VOG, strengere controles. Voor kleinere partijen is dat een flinke drempel.

  Haalt jouw bureau het niet, dan mag je vanaf 2028 niet meer via die partij inlenen. Ook niet als die mensen al jaren bij je werken en precies weten hoe alles loopt.

  Zo werkt afhankelijkheid. Je voelt het pas als het te laat is.

  Wie rechtstreeks met zelfstandigen werkt, bouwt een eigen flexibele schil. Die relatie is van jou, niet van een bureau.

  Bekijk onze website.
