onderwerp: "Kerstrust? Kijk eerst even naar je inhuur."
linkedin: |
  Klap je straks de laptop dicht voor de kerst? Beantwoord eerst deze drie vragen.

  Welke partijen leveren mensen aan ons?
  Hebben die zich aangemeld voor de overgangsregeling van de Wtta?
  Welke zzp'ers werken er rechtstreeks voor ons, en is dat goed vastgelegd?

  Lukt dat, dan ga je met een gerust hart de feestdagen in.

  Lukt dat niet, dan weet je wat je eerste klus in januari wordt. In 2027 gaat de wet in. Een jaar later wordt er gehandhaafd, ook bij jou.

  Eén uur werk nu scheelt je volgend jaar een hoop gedoe.

  Bekijk onze website.
