  Over tien dagen sluit de overgangsregeling. En deze week zitten de meeste bureaus al half op vakantie.

  Wacht dus niet tot na de kerst. Stuur je uitzendbureau, detacheerder of payroller vandaag een mail: hebben jullie je aangemeld voor de overgangsregeling, en kunnen jullie dat bevestigen?

  Ja? Mooi. Bewaar die mail.

  Geen antwoord voor de kerst? Dat zegt ook iets. Dan weet je dat je in januari als eerste moet uitzoeken met wie je eigenlijk zaken doet.

  Vijf minuten werk. Meer is het niet.

  Bekijk onze website.
