  Donderdag sluit de overgangsregeling. Vrijdag gaat de Wtta in. En jij zit misschien gewoon op de bank.

  Prima. Pak deze rustige week wel één keer je facturen van 2026 erbij.

  Welke bureaus staan erop? Welke zzp'ers? Wat heb je in totaal aan externe inzet uitgegeven? En hoeveel daarvan ging naar marges?

  Dat ene getal zegt meer dan welk adviesrapport ook. Het laat zien hoe afhankelijk je bent, en wat het je kost.

  In 2027 moeten uitleners hun toelating regelen. Jij moet uitzoeken of jouw partijen dat halen. Hoe eerder je weet met wie je werkt, hoe meer keuze je hebt.

  Bekijk onze website.
