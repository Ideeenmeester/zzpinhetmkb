linkedin: |
  De meeste ondernemers weten precies wat hun leaseauto kost. Wat hun externe inzet kost, weten ze niet.

  Mijn voornemen voor iedere mkb'er in 2027: weet wie er voor je werkt.

  Hoeveel mensen. Via welke partij. Tegen welk tarief en welke opslag. En of de samenwerking zo is ingericht dat je er met een gerust hart op kunt bouwen.

  Bij de meeste bedrijven zit die informatie verspreid over afdelingen, mailboxen en facturen. Met de Wtta en de handhaving op schijnzelfstandigheid is dat overzicht geen luxe meer.

  Fijne jaarwisseling. En begin januari met die ene lijst.

  Bekijk onze website.
