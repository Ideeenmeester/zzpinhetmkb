onderwerp: "De Wtta is er"
linkedin: |
  Sinds vrijdag geldt de Wtta. Je merkt er niets van. Nog niet.

  De uitzendkracht komt gewoon, de gedetacheerde ook. Dat maakt het verraderlijk.

  Want de klok loopt. In mei en juni vragen uitleners hun toelating aan. Vanaf juli zie je in het register wie het heeft gehaald. En vanaf 1 januari 2028 mag je alleen nog met toegelaten partijen werken.

  Elk bedrijf dat inleent, heeft dit jaar een klus. Overzicht maken. Leveranciers controleren. En kritisch kijken of al die inhuur via tussenpartijen wel nodig is.

  Als je toch zelf verantwoordelijk bent, kun je het ook zelf regelen.

  Bekijk onze website.
