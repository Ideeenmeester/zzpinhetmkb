onderwerp: "Je hebt één jaar. Gebruik het."
linkedin: |
  Twaalf maanden. Dan controleert de Arbeidsinspectie ook jou. Wie in november begint, heeft geen keuzes meer.

  Je hebt tot 1 januari 2028 om ervoor te zorgen dat je alleen nog werkt met uitleners die een toelating hebben. Dat betekent: weten wie je uitleners zijn, weten of ze een toelating aanvragen en een plan B hebben als het misgaat.

  Dat plan B vergeten de meeste bedrijven. Wat doe je als het bureau waar je vijf mensen via inhuurt, in juli niet in het register staat? Dan heb je een half jaar om iets anders te regelen.

  Maak deze maand je overzicht. Dan bepaal jij het tempo, niet de deadline.

  Bekijk onze website.
