onderwerp: "Een naheffing komt altijd achteraf"
linkedin: |
  Een naheffing komt nooit op een moment dat het je uitkomt. Hij komt achteraf, over alle maanden dat het niet klopte.

  Zolang iedereen tevreden is, gaat het goed. De zzp'er stuurt zijn factuur, jij betaalt, het werk wordt gedaan.

  Tot de Belastingdienst concludeert dat die zzp'er in de praktijk gewoon werknemer was. Dan kan er een naheffing van loonheffingen volgen. Bij iemand die al jaren bij je werkt, loopt dat hard op.

  Een bureau ertussen haalt dat risico niet weg. Goed inrichten wel: een echte opdracht, eigen regie voor de zelfstandige, eigen risico. En dat vastgelegd.

  Weet je zeker dat het bij jou zo zit?

  Bekijk onze website.
