linkedin: |
  Draagt je uitzendbureau zijn loonheffing niet af? Dan kan de Belastingdienst bij jou aankloppen. Dat was al zo.

  Inlenersaansprakelijkheid bestaat al jaren. Daarom zijn er G-rekeningen en certificeringen.

  Met de Wtta komt daar een eigen plicht bij: vanaf 2028 alleen nog inlenen bij toegelaten uitleners.

  Inhuren via een bureau wordt vaak verkocht als de veilige route. Maar als inlener stond je al die tijd zelf in de risicoketen. En die wordt alleen maar langer.

  Dan mag je je best afvragen waarvoor je die tussenpartij elk uur betaalt.

  Bekijk onze website.
