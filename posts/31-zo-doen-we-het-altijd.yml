onderwerp: "\"Zo doen we het altijd\" is geen verweer"
linkedin: |
  "Zo doen we het hier al tien jaar." Bij een controle is dat het slechtste antwoord dat je kunt geven.

  De vaste zzp'er die al jaren meedraait. Het bureau waar de afdeling altijd mee belt. Het werkte, dus waarom zou je het veranderen?

  Omdat de regels veranderd zijn. De Belastingdienst handhaaft weer op schijnzelfstandigheid en kijkt naar hoe je vandaag samenwerkt. Vanaf 2028 controleert de Arbeidsinspectie ook of je alleen inleent bij toegelaten uitleners.

  Dat het jarenlang goed ging, betekent vooral dat er jarenlang niemand keek.

  Pak dit jaar je externe inzet er eens bij. Persoon voor persoon.

  Bekijk onze website.
