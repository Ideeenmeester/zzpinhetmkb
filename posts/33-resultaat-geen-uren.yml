  "32 uur per week op de afdeling." Gefeliciteerd, je hebt net een functie omschreven. Geen opdracht.

  Zo staat het in heel veel overeenkomsten met zzp'ers. En precies daar begint het risico.

  Wie uren koopt, gaat ook bepalen hoe die uren besteed worden. Dan stuur je aan. Dan lijkt het op een dienstverband.

  Schrijf het anders op. "Oplevering van een nieuw voorraadsysteem, inclusief training, voor 1 april." Dat is een resultaat. De zelfstandige bepaalt zelf hoe hij daar komt.

  Niet elke opdracht heeft een einddatum. Maar hoe concreter het resultaat, hoe sterker je staat.

  Bekijk onze website.
