onderwerp: "Wie bepaalt hoe het werk gebeurt?"
linkedin: |
  Je huurt een vakman in en vertelt hem vervolgens hoe hij zijn vak moet doen.

  Het gebeurt elke dag. Welke stappen, in welke volgorde, met welke tool. Precies zoals je het bij je eigen medewerkers doet.

  Eisen stellen mag. Aan het resultaat, de kwaliteit, de deadline, de veiligheidsregels op je terrein. Dat hoort bij opdrachtgeverschap.

  Maar zodra jij ook het hoe bepaalt, schuif je richting gezag. En gezag is precies wat een dienstverband kenmerkt.

  Spreek af wat er moet komen. Laat het hoe bij de zelfstandige. Dat is juridisch sterker en meestal levert het ook beter werk op.

  Bekijk onze website.
