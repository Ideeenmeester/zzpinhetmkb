  Vijf dagen per week, al vier jaar, alleen voor jou. Noem je dat nog een ondernemer?

  Een zelfstandige met meerdere klanten verdeelt zijn tijd, zoekt nieuw werk en bepaalt zijn eigen koers. Een zzp'er die alleen van jou afhankelijk is, lijkt daar steeds minder op.

  Eén opdrachtgever maakt iemand niet meteen schijnzelfstandig. Het weegt wel mee.

  Je kunt er als opdrachtgever iets aan doen. Baken opdrachten af in tijd en resultaat in plaats van iemand structureel fulltime in te zetten.

  En heb je eigenlijk iemand nodig die elke dag onder jouw aansturing werkt? Bied dan een contract aan. Ook dat is het goed regelen.

  Bekijk onze website.
