onderwerp: "Wie bepaalt het tarief?"
linkedin: |
  Weet jij wat jouw zzp'er eigenlijk verdient? Grote kans dat een bureau dat voor jullie allebei heeft bepaald.

  Bij een echte ondernemer gaat het anders. Hij maakt een prijs, jij onderhandelt en samen kom je eruit. Zoals met elke leverancier.

  Via een tussenpartij bepaalt het bureau wat de zzp'er krijgt en wat jij betaalt. Het verschil is de marge.

  De zelfstandige heeft daardoor minder grip op zijn eigen ondernemerschap. Jij betaalt meer dan nodig. En een vast tarief van een bureau lijkt eerder op loon dan op een prijs.

  Rechtstreeks afspreken is eerlijker voor beide kanten. En het past beter bij wat zelfstandigheid hoort te zijn.

  Bekijk onze website.
