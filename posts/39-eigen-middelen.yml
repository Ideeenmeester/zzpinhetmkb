  Laptop van de zaak, bedrijfsauto, telefoon en werkkleding met jouw logo. Gefeliciteerd, je hebt een werknemer aangekleed.

  Van een ondernemer verwacht je iets anders. De timmerman komt met zijn eigen bus en gereedschap. De IT'er met zijn eigen laptop en licenties. De adviseur met zijn eigen methodes.

  Hoe meer een zzp'er van jou krijgt, hoe kleiner het verschil met je eigen personeel.

  Soms moet iemand jouw systemen gebruiken, bijvoorbeeld om veiligheidsredenen. Prima. Maar dan als uitzondering met een reden, niet als standaard.

  Zet eens op een rij wat jouw zelfstandigen allemaal van jou krijgen.

  Bekijk onze website.
