onderwerp: "Vijf jaar dezelfde zzp'er op dezelfde plek"
linkedin: |
  Hij werkt er al vijf jaar, staat op de teamfoto en iedereen denkt dat hij in dienst is. Misschien denkt de Belastingdienst dat ook.

  Iedere organisatie heeft er wel een. Goed in zijn vak, kent iedereen, hoort erbij.

  Maar langdurig hetzelfde werk, op dezelfde plek, opgenomen in het team, is precies het profiel waar bij een controle naar wordt gekeken. Hoe langer het duurt, hoe lastiger je kunt uitleggen dat het geen dienstverband is.

  Afscheid nemen hoeft niet. Kijk wel kritisch. Is er nog een duidelijke opdracht? Bepaalt hij zelf hoe hij werkt? Heeft hij ook andere klanten?

  Of is het tijd voor een contract? Beide kan. Als je maar bewust kiest.

  Bekijk onze website.
