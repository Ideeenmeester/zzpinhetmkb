onderwerp: "Een modelovereenkomst is geen vrijbrief"
linkedin: |
  Een modelovereenkomst in de la en denken dat je veilig zit. Het is een van de duurste misverstanden van dit moment.

  Een modelovereenkomst laat zien hoe het bedoeld is. Bij een controle wordt gekeken hoe het werkelijk gaat. Staat er dat er geen gezag is, terwijl je zzp'er elke dag wordt aangestuurd? Dan wint de praktijk.

  Een goed contract is dus een begin, geen eindpunt.

  Wat wel helpt: een heldere opdracht, afspraken die kloppen met hoe je echt werkt, en de discipline om je eraan te houden. Plus kunnen laten zien dat je dat doet.

  Dat laatste vergeten bijna alle bedrijven.

  Bekijk onze website.
