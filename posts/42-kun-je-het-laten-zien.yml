onderwerp: "Kun je laten zien hoe je samenwerkt?"
linkedin: |
  Stel dat de Belastingdienst morgen vraagt hoe je samenwerkt met je zzp'ers. Hoe lang ben je dan aan het zoeken?

  Bij de meeste bedrijven zitten de afspraken overal. Een offerte in de mail van een manager. Een overeenkomst ergens op de server. Facturen in de boekhouding. De rest in iemands hoofd.

  Goed regelen is één ding. Kunnen aantonen dat je het goed hebt geregeld, is iets anders.

  Wat helpt is per samenwerking één dossier: de opdracht, de overeenkomst, de afspraken over resultaat en werkwijze, de facturen. Op één plek, altijd bij de hand.

  Daarvoor is zzp in het mkb gemaakt. Overzicht en vastlegging, zonder bureau ertussen.

  Bekijk onze website.
