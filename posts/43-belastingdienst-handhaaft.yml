linkedin: |
  Jarenlang keek er bijna niemand naar je zzp'ers. Die tijd is voorbij.

  Sinds 1 januari 2025 handhaaft de Belastingdienst weer op schijnzelfstandigheid. Er wordt gekeken naar de feitelijke werkrelatie en waar nodig volgt een naheffing van loonheffingen. Boetes zijn niet uitgesloten.

  En nu de Wtta van kracht is, krijgt externe inzet van twee kanten aandacht.

  Wie zijn samenwerking met zelfstandigen goed heeft ingericht, hoeft niet wakker te liggen. Een echte opdracht, eigen regie, eigen risico en dat netjes vastgelegd.

  Wie denkt dat het wel meevalt, merkt pas dat het niet meevalt als de brief op de mat ligt.

  Bekijk onze website.
