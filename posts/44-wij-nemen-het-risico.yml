  "Wij nemen alle risico's van je over." Het staat op de site van bijna elk bureau. Vraag eens welk risico precies.

  Je controleplicht onder de Wtta kan een bureau niet overnemen. Die ligt wettelijk bij jou. De inlenersaansprakelijkheid voor loonheffingen ook niet. En functioneert een zzp'er via een bemiddelaar bij jou als werknemer, dan kijkt de Belastingdienst naar de werkelijkheid. Niet naar de folder.

  Wat een bureau wel kan bieden, is een vrijwaring in het contract. Lees die goed. Wat dekt ze, tot welk bedrag, en wat gebeurt er als het bureau zelf omvalt?

  Vaak blijkt de zekerheid een stuk kleiner dan de marge.

  Bekijk onze website.
