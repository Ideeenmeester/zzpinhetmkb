onderwerp: "Wat betaal je eigenlijk per uur aan een bureau?"
linkedin: |
  Leg de factuur van je bureau eens naast wat je zzp'er zelf ontvangt. Schrik niet.

  Het verschil is wat de tussenpartij verdient. Bij €75 per uur en 20 procent opslag is dat €15 per uur. Werkt die zzp'er 1.600 uur per jaar voor je, dan is dat €24.000. Voor één persoon.

  Dat mag, als er iets tegenover staat. Werving, selectie, vervanging bij uitval.

  Maar ken je die zzp'er al jaren en gebruik je die diensten nooit? Dan betaal je vooral voor de gewoonte. Elk uur, elke week, elk jaar.

  Doe de vergelijking deze week. Het kost je tien minuten.

  Bekijk onze website.
