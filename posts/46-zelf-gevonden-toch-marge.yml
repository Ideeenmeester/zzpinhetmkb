onderwerp: "Zelf gevonden. Toch marge betalen."
linkedin: |
  Je hebt de zzp'er zelf gevonden, zelf gesproken en zelf het tarief afgesproken. En toch betaal je een bureau.

  Het gebeurt vaker dan je denkt. Een manager kent een goede zelfstandige uit zijn netwerk, alles is rond, en dan zegt inkoop: alle externe inhuur loopt via ons vaste bureau.

  Dat bureau heeft niemand geworven en niemand geselecteerd. Maar het rekent wel een opslag op elk uur.

  Vaak is dat beleid bedoeld als voorzichtigheid. Een bureau ertussen voelt veilig. Alleen verandert dat niets aan je eigen verantwoordelijkheid onder de Wtta.

  Je betaalt dan voor veiligheid die er niet is, bij iemand die je zelf hebt gevonden.

  Bekijk onze website.
