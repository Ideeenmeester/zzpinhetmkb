onderwerp: "Hoe afhankelijk ben jij van je bureau?"
linkedin: |
  Je bureau verhoogt volgend jaar de opslag. Wat doe je dan? Juist. Betalen.

  Drie vragen die laten zien hoe afhankelijk je bent.

  Wat doe je als het bureau zijn prijzen verhoogt? Wat doe je als het in 2028 geen Wtta-toelating blijkt te hebben? Wat doe je als het failliet gaat?

  Is het antwoord drie keer "dan hebben we een probleem", dan ben je afhankelijk. Niet alleen van het bureau, ook voor het contact met je eigen mensen. Want die relatie loopt via hen.

  Wie zijn eigen netwerk van zelfstandigen heeft en rechtstreeks afspraken maakt, kan op alle drie die vragen zeggen: dan werken we gewoon door.

  Bekijk onze website.
