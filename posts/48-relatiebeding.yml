onderwerp: "Lees je contract: het relatiebeding"
linkedin: |
  Die zzp'er werkt al drie jaar via een bureau bij jou. Je wilt hem rechtstreeks inhuren. Mag dat eigenlijk wel?

  Kijk eerst in je contract met het bureau. Grote kans dat er een relatiebeding in staat. Dat verbiedt je om iemand die via het bureau is gekomen binnen een bepaalde termijn rechtstreeks in te huren. Of het mag, maar tegen een flinke vergoeding.

  Vanuit het bureau is dat logisch. Het wil zijn investering terugverdienen.

  Het laat ook zien hoe vast je zit. Je kent de zzp'er, hij werkt goed, iedereen is tevreden. En toch bepaalt een partij ertussen onder welke voorwaarden jullie verder mogen.

  Weet jij wat er in jouw contracten staat?

  Bekijk onze website.
