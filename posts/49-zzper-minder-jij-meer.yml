onderwerp: "De zzp'er krijgt minder, jij betaalt meer"
linkedin: |
  Jij betaalt €90 per uur. Je zzp'er krijgt €72. Allebei voelen jullie je tekortgedaan, en dat klopt.

  Voor jou is €90 een fors tarief. Voor de zzp'er is €72 minder dan hij zelf zou vragen. Alleen de partij in het midden heeft een goed verhaal.

  Stel dat jullie elkaar rechtstreeks vinden en samen €80 afspreken. Jij betaalt minder, hij verdient meer, en niemand levert iets in.

  Daarom werken wij aan rechtstreekse samenwerking. Bureaus zijn niet slecht. Maar elke euro die tussen opdrachtgever en zelfstandige blijft hangen, is voor allebei verloren.

  Bekijk onze website.
