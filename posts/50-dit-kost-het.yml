linkedin: |
  Eén zzp'er goed geregeld inzetten kost je per maand minder dan één uur bureau-opslag.

  €9,99 per maand voor je bedrijf. €4,95 per maand per lopende overeenkomst. Dat is het.

  Geen percentage op de gewerkte uren. Geen marge op het tarief van de zzp'er. De zelfstandige betaalt niets.

  Daarvoor krijg je overzicht van al je externe inzet, overeenkomsten die je rechtstreeks met de zzp'er sluit, en hulp om de samenwerking goed in te richten en vast te leggen.

  Waarom zo weinig? Omdat software geen tussenpartij hoeft te zijn. Wij doen niet mee in jullie samenwerking. We zorgen dat die klopt.

  Leg het eens naast wat je nu per uur aan opslag betaalt.

  Bekijk onze website.
