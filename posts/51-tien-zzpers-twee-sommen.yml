linkedin: |
  €150.000 of €714 per jaar. Voor dezelfde tien zzp'ers en precies hetzelfde werk.

  Neem een bedrijf met tien zzp'ers die ieder 1.000 uur per jaar werken tegen €75 per uur.

  Via een tussenpartij met 20 procent opslag betaal je €150.000 per jaar bovenop hun tarieven.

  Via zzp in het mkb betaal je €9,99 per maand en €4,95 per lopende overeenkomst per maand. Voor tien overeenkomsten komt dat op €714 per jaar.

  Het verschil is geen paar procent. Het is een fulltime functie, een investering of gewoon winst.

  De verantwoordelijkheid lag in beide gevallen bij jou. In het tweede geval heb je hem alleen zelf in handen.

  Bekijk onze website.
