onderwerp: "Waarom geen percentage op uren?"
linkedin: |
  Je zzp'er werkt 1.000 uur in plaats van 10. Het bureau verdient honderd keer zoveel. Doet het ook honderd keer zoveel?

  Bij werving en selectie snap ik een vergoeding. Daar zit werk in.

  Maar als de samenwerking eenmaal loopt, gaat het om overzicht, een goede overeenkomst en administratie. Dat werk wordt niet groter als de zzp'er meer uren maakt.

  Toch loopt het percentage door. Elk uur, elke week, zolang de samenwerking duurt.

  Wij hebben daarom bewust gekozen voor een vast bedrag. €9,99 per maand en €4,95 per lopende overeenkomst per maand. Of je zzp'er nu tien uur werkt of duizend.

  Bekijk onze website.
