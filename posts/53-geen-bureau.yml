onderwerp: "Zzpinhetmkb is geen bureau"
linkedin: |
  Wij zijn geen bureau. Wij verdienen geen cent aan de uren van jouw zzp'ers.

  Een bureau zit tussen jou en de zelfstandige. Het sluit contracten met beide kanten, praat mee over het tarief en verdient aan elk gewerkt uur.

  Zzp in het mkb zit ernaast. Jij en de zzp'er sluiten de overeenkomst rechtstreeks. Jullie spreken samen het tarief af. Wij zorgen voor overzicht, vastlegging en ondersteuning als je die nodig hebt.

  Omdat je ons per maand en per overeenkomst betaalt, hebben we er geen belang bij dat iemand zo lang mogelijk blijft of zoveel mogelijk uren maakt.

  Ons enige belang is dat het goed geregeld is.

  Bekijk onze website.
