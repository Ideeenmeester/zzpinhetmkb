onderwerp: "De overeenkomst is van jullie"
linkedin: |
  Huur je een zzp'er via een bureau in, dan hebben jullie samen formeel helemaal niets met elkaar.

  Jij hebt een contract met het bureau. De zzp'er ook. Daartussen ligt niets. Afspraken over tarief, verlenging of een gewijzigde opdracht lopen via een derde.

  Dat voelt makkelijk, tot je iets wilt veranderen.

  Bij zzp in het mkb sluiten opdrachtgever en opdrachtnemer de overeenkomst rechtstreeks. Jullie maken samen de afspraken over resultaat, prijs en uitvoering. Wij helpen het goed vast te leggen, maar we zijn geen partij in jullie samenwerking.

  Twee ondernemers die samen zaken doen. Zo hoort het.

  Bekijk onze website.
