linkedin: |
  Hoeveel zelfstandigen werken er nu voor jouw bedrijf, en wat kosten ze samen? Als je dat niet binnen een minuut weet, heb je een probleem.

  Niet omdat het je niet interesseert. Omdat de informatie overal zit. Bij afdelingen, in mailboxen, op de server, in de boekhouding.

  Met de handhaving op schijnzelfstandigheid en de Wtta is dat een risico geworden. Je moet kunnen laten zien met wie je werkt, op basis van welke afspraken en tegen welke kosten.

  In zzp in het mkb staat dat bij elkaar. Alle zelfstandigen, alle overeenkomsten, alle afspraken. In één oogopslag zie je waar je staat.

  Bekijk onze website.
