  Loop jij risico met je externe inzet? Over drie minuten weet je het.

  De meeste ondernemers hebben een gevoel. Het gaat wel goed, denken ze. Of juist: daar moeten we echt eens naar kijken.

  Met de scan op onze website krijg je in een paar minuten zicht op je situatie. Hoeveel externen werken er, via welke route, en waar liggen de aandachtspunten rond de Wtta en zelfstandigheid?

  Geen juridisch advies. Wel een eerlijke eerste blik, en meestal genoeg om te weten of je in actie moet komen.

  Drie minuten nu bespaart je later een hoop gedoe.

  Bekijk onze website.
