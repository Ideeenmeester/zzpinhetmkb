onderwerp: "Zzp'er? Scan je zelfstandigheid."
linkedin: |
  Zzp'er? Je opdrachtgevers worden banger. En dat ga je merken in je agenda.

  Door de handhaving op schijnzelfstandigheid en de komst van de Wtta denken bedrijven twee keer na voordat ze een zelfstandige inhuren. Sommige stoppen er helemaal mee.

  Je kunt daar zelf iets aan doen. Hoe beter je laat zien dat je echt ondernemer bent, hoe makkelijker het voor een opdrachtgever wordt. Eigen werkwijze, eigen tarief, meerdere klanten, eigen risico.

  Op onze website staat een zelfstandigheidsscan. Je ziet direct waar je sterk staat en waar je aandachtspunten liggen.

  Zo maak je het je klanten makkelijker om met jou te werken.

  Bekijk onze website.
