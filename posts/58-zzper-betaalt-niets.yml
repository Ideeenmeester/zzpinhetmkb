linkedin: |
  Zzp'er en elke maand een percentage van je omzet kwijt aan een platform? Dat hoeft niet.

  Bij zzp in het mkb betaal je als zelfstandige niets. Geen inschrijfkosten, geen abonnement, geen percentage van je tarief.

  De opdrachtgever betaalt een klein vast bedrag voor het gebruik. Jij en je opdrachtgever spreken samen het tarief af, en dat tarief is van jou.

  Een ondernemer bepaalt zelf wat zijn werk waard is. En elke euro die je verdient, hoort bij jou te landen.

  Ben je zelfstandig en wil je rechtstreeks met opdrachtgevers werken? Meld je aan.

  Bekijk onze website.
