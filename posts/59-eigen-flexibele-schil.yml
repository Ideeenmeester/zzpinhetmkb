onderwerp: "Bouw je eigen flexibele schil"
linkedin: |
  Je had de perfecte zzp'er al gevonden. En bij de volgende klus begin je toch weer bij het bureau.

  Na een opdracht verliezen bedrijven vaak het contact. Komt er nieuw werk, dan begint de zoektocht opnieuw. Bellen, profielen bekijken, kennismaken, onderhandelen.

  Zonde. Een goede zelfstandige kent je bedrijf, je mensen en je manier van werken.

  Bouw je eigen netwerk. Mensen die je kent, van wie je weet wat ze kunnen, en die je rechtstreeks benadert als er weer een opdracht is. Dat is je eigen flexibele schil, zonder afhankelijkheid van een tussenpartij en zonder marge.

  In zzp in het mkb houd je dat netwerk bij.

  Bekijk onze website.
