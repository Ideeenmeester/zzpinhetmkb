linkedin: |
  Negen jaar geleden zeiden ze dat scholen niet zonder bureau met zzp'ers konden werken. Het kon wel.

  Zo begon Flexonderwijs. Scholen en zelfstandige onderwijsprofessionals vinden elkaar, maken rechtstreeks afspraken en organiseren hun samenwerking goed. Zonder marge op de uren.

  In die negen jaar hebben we geleerd wat werkt. Hoe je een opdracht goed omschrijft. Hoe je zelfstandigheid borgt. Hoe je het overzicht houdt.

  Steeds vaker kwam de vraag: kan dit ook in andere sectoren?

  Dat kan. Met Zoriva en zzp in het mkb brengen we dezelfde manier van werken naar het mkb. Andere sector, dezelfde gedachte.

  Bekijk onze website.
