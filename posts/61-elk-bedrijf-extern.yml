linkedin: |
  Bouw, IT, installatie, webshop, advies. Werk je met mensen die niet bij jou in dienst zijn, dan ben jij straks aanspreekbaar.

  Het maakt niet uit hoe groot je bent. Leen je in via een bureau, dan moet die uitlener vanaf 1 januari 2028 een toelating hebben en moet jij dat kunnen laten zien. Werk je rechtstreeks met zelfstandigen, dan moet die samenwerking echt zelfstandig zijn.

  Twee vragen die elk bedrijf met externe inzet krijgt. De meeste mkb'ers kunnen ze vandaag niet beantwoorden.

  Zzpinhetmkb is gemaakt voor precies die bedrijven. Groot of klein, welke sector ook. Je regelt het goed, zonder dat het veel kost.

  Bekijk onze website.
