onderwerp: "IT: de freelancer die al jaren in je team zit"
linkedin: |
  Drie jaar in hetzelfde scrumteam, elke ochtend bij de stand-up, tickets van hetzelfde bord. Noem je dat nog een freelancer?

  In de IT is freelancen normaal. Juist daarom valt het niemand meer op als een opdracht stilletjes een functie wordt.

  Voor de Belastingdienst lijkt dat op een dienstverband. En komt die developer via een detacheerder of bemiddelaar, dan speelt ook de Wtta.

  Het kan anders. Laat een freelancer een afgebakend onderdeel bouwen, een migratie uitvoeren of een architectuur opleveren. Met zijn eigen aanpak en een duidelijk eindresultaat.

  Zo zet je IT-expertise veilig in. En heb je geen tussenpartij nodig die op elk uur meeverdient.

  Bekijk onze website.
