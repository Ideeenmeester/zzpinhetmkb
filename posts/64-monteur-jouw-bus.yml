onderwerp: "Techniek en installatie: wie stuurt de monteur aan?"
linkedin: |
  Rijdt de zzp-monteur in jouw bus, met jouw werkbonnen en jouw bedrijfskleding? Dan is hij voor een controleur geen ondernemer.

  In de installatietechniek is het tekort aan vakmensen groot. Pieken vang je op met extra krachten. Logisch.

  Maar komt die monteur via een bureau en stuur jij hem aan, dan leen je in. Dat bureau heeft vanaf 2028 een toelating nodig. Werkt hij rechtstreeks voor je, dan is de vraag hoe zelfstandig dat is.

  Een zelfstandig installateur neemt een complete klus aan. Eigen bus, eigen gereedschap, eigen planning. Dat is ondernemen, en dat regel je gewoon rechtstreeks.

  Bekijk onze website.
