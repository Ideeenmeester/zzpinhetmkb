onderwerp: "Evenementen en horeca: eerlijk over gezag"
linkedin: |
  Achter de bar, in de bediening of als crew op een festival werkt bijna niemand echt zelfstandig. Daar moeten we eerlijk over zijn.

  Jij bepaalt de diensten. Jij verdeelt de taken. Jij kiest de kleding. Dat hoort bij het werk, en het is gezag.

  Dan is een zzp-constructie geen goed idee. Kies voor eigen personeel of voor een uitlener met een toelating. En controleer die toelating vanaf 2028 zelf.

  Ook in deze branches zijn er echte zelfstandigen. De cateraar, de lichttechnicus met eigen apparatuur, de evenementenproducent. Zij nemen een klus aan en voeren die zelf uit.

  Goed regelen betekent ook weten wanneer zzp niet past.

  Bekijk onze website.
