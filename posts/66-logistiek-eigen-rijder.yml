onderwerp: "Logistiek: chauffeurs en planners"
linkedin: |
  Een chauffeur in jouw truck, op jouw route, volgens jouw planning. Hoe zelfstandig is dat nog?

  In de logistiek lopen zelfstandigheid en inlenen voortdurend door elkaar.

  De eigen rijder heeft een eigen vrachtwagen, een vergunning, meerdere opdrachtgevers en eigen risico. Dat is ondernemerschap.

  De zzp-chauffeur die bij jou instapt en doet wat de planner zegt, is iets anders. Komt hij via een bureau, dan leen je in en moet dat bureau vanaf 2028 een toelating hebben. Hetzelfde geldt voor planners en magazijnmedewerkers via een uitlener.

  Logistieke bedrijven werken met veel externen. Weet per persoon in welke categorie hij valt, voordat iemand anders het voor je bepaalt.

  Bekijk onze website.
