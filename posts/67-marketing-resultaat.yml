  De freelance marketeer zit al twee jaar drie dagen per week in je team. Heb je een opdracht ingekocht of een functie?

  Creatief werk is eigenlijk het schoolvoorbeeld van goede zzp-inzet. Een huisstijl, een campagne, een website. Het resultaat is helder, de maker werkt met eigen software en voor meerdere klanten.

  Het gaat schuren als iemand structureel de socials bijhoudt en zijn taken dagelijks van de marketingmanager krijgt. Dan is het geen opdracht meer.

  Houd het bij werk met een duidelijk eindresultaat. Dan werk je rechtstreeks samen, zonder zorgen en zonder bureau ertussen.

  Bekijk onze website.
