onderwerp: "Wanneer een zzp'er niet de oplossing is"
linkedin: |
  Soms is een zzp'er gewoon de verkeerde keuze. Dat zeggen wij, terwijl we het rechtstreeks werken met zelfstandigen juist makkelijk maken.

  Heb je iemand nodig die je elke dag aanstuurt? Is het werk structureel, zonder begin en eind? Wil jij bepalen hoe, waar en wanneer er gewerkt wordt? Dan zoek je een medewerker.

  Neem iemand in dienst. Of werk met een uitlener die een toelating heeft, en controleer dat.

  Wat we niet willen: bedrijven die uit angst stoppen met zelfstandigen, terwijl veel werk prima past bij een opdracht. Of bedrijven die uit gemak een werknemer als zzp'er laten werken.

  Goed regelen is per situatie de juiste vorm kiezen.

  Bekijk onze website.
