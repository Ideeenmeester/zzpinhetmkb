linkedin: |
  Eén vraag bepaalt of je straks een boete riskeert: werkt deze persoon onder jouw leiding en toezicht?

  Ja, en hij komt via een andere partij? Dan leen je in. Die partij heeft vanaf 2028 een toelating nodig en jij moet dat controleren.

  Ja, en hij werkt rechtstreeks als zzp'er voor je? Dan is het in werkelijkheid waarschijnlijk een dienstverband.

  Nee, hij voert een opdracht uit op zijn eigen manier, voor eigen rekening en risico? Dan kun je rechtstreeks met hem werken. Zonder tussenpartij.

  Wtta, DBA, inlenersaansprakelijkheid: bijna alles komt terug op die ene vraag. Stel hem voor iedere externe die bij je werkt.

  Bekijk onze website.
