linkedin: |
  "Met een zzp'er loop je altijd risico." Wie dat gelooft, betaalt te veel en mist goede mensen.

  Het risico zit niet in de zzp'er. Het zit in hoe je samenwerkt. Een zelfstandige die als werknemer functioneert, is een probleem. Een zelfstandige die als ondernemer een opdracht uitvoert, is dat niet.

  Je koopt ook diensten in bij een accountant, een schoonmaakbedrijf of een IT-leverancier. Niemand vindt dat eng. Een zzp'er is in de basis hetzelfde: een bedrijf dat een dienst levert.

  Spreek een resultaat af, laat de werkwijze bij de vakman en leg het vast. Dan is het risico niet groter dan bij elke andere leverancier.

  Bekijk onze website.
