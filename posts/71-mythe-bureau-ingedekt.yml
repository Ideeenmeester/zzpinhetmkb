  De duurste mythe in het mkb: "Via een bureau ben ik ingedekt."

  Vanaf 1 januari 2028 moet jij controleren of je uitlener een toelating heeft. Doe je zaken met een partij zonder, dan kun jij de boete krijgen.

  Draagt de uitlener zijn loonheffingen niet af, dan kan de Belastingdienst jou aanspreken. En werkt er via een bemiddelaar een zzp'er bij je die in de praktijk werknemer is, dan helpt het woord bureau je weinig.

  Een bureau kan nuttig zijn voor werving en flexibiliteit. Je verantwoordelijkheid neemt het niet over.

  Wie dat beseft, kijkt anders naar de opslag die op elk uur wordt gerekend.

  Bekijk onze website.
