  "Bij kleine bedrijven controleren ze toch niet." Tot er één keer wel gecontroleerd wordt.

  De wet maakt geen onderscheid naar omvang. De Wtta geldt voor iedereen die inleent. De regels over schijnzelfstandigheid gelden voor iedere opdrachtgever.

  En de klap is voor een mkb'er vaak groter. Een naheffing over een paar jaar loonheffingen raakt een bedrijf met twintig man harder dan een concern met een eigen juridische afdeling.

  Controles komen ook niet altijd uit het niets. Een zzp'er met een conflict, een uitlener die zelf wordt doorgelicht, een melding. Zo kom je alsnog in beeld.

  Gokken kost meer dan het goed regelen.

  Bekijk onze website.
