onderwerp: "Mythe: \"Die wet wordt vast weer uitgesteld\""
linkedin: |
  Wie nu nog op uitstel van de Wtta rekent, gokt met zijn eigen bedrijf.

  Ja, de wet is een paar keer uitgesteld. En bij de Wet DBA hebben we jarenlang een handhavingsmoratorium gehad. Die reflex snap ik.

  Maar de Wtta geldt sinds 1 januari 2027. Uitleners hebben zich aangemeld voor de overgangsregeling. Zaterdag begint de aanvraagperiode bij de NAU. En vanaf 1 januari 2028 handhaaft de Arbeidsinspectie.

  De Belastingdienst handhaaft sinds 2025 ook weer op schijnzelfstandigheid.

  Elke maand die je wacht, is een maand minder om het goed te regelen.

  Bekijk onze website.
