onderwerp: "Wat jouw bureau nu moet regelen"
linkedin: |
  Mist jouw uitlener één onderdeel van zijn Wtta-aanvraag, dan heb jij in 2028 een probleem.

  Dit moet er liggen. Een VOG voor de onderneming. Correcte loonbetaling aan de mensen die worden uitgeleend. Correcte belastingaangiften. Een waarborgsom van €100.000, tenzij er ontheffing geldt. Goedgekeurde huisvesting als het om arbeidsmigranten gaat. En de aanvraag zelf, tussen 1 mei en 30 juni.

  Daarna blijft de uitlener onder toezicht. Wie niet meer voldoet, kan de toelating kwijtraken.

  Een toelating is dus niet iets om één keer af te vinken. Je zult het blijvend moeten volgen. Hoeveel tijd wil jij daaraan kwijt zijn?

  Bekijk onze website.
