onderwerp: "De aanvraagperiode is begonnen"
linkedin: |
  Sinds zaterdag bepaalt de NAU welk uitzendbureau over acht maanden nog aan jou mag uitlenen.

  Tot en met 30 juni dienen uitleners hun aanvraag in. Vanaf 1 juli zie je in het openbare register wie een toelating heeft, een ontheffing, of nog onder de overgangsregeling valt.

  Vanaf 1 januari 2028 mag je alleen nog met die partijen werken.

  Pak dus nu je lijst. Welke uitleners leveren mensen aan je? Van welke weet je zeker dat ze hun aanvraag indienen? En waar twijfel je?

  Bij die laatste groep zit je risico. Begin daar.

  Bekijk onze website.
