onderwerp: "Wat als je bureau wordt afgewezen?"
linkedin: |
  Je bureau vraagt een toelating aan en de NAU zegt nee. Wie werkt er dan nog bij jou?

  Niet elke aanvraag wordt goedgekeurd. Uitleners zonder loon- en belastingzaken op orde, zonder VOG of zonder waarborgsom vallen af.

  Dan kunnen de mensen die je via die partij inleent, niet op die manier blijven werken. Ook als ze goed zijn. Ook als je ze hard nodig hebt.

  Je hebt dan drie opties. Een andere uitlener zoeken en opnieuw beginnen. Iemand zelf in dienst nemen. Of, als het werk zich ervoor leent, rechtstreeks samenwerken met een zelfstandige op basis van een echte opdracht.

  Die keuze wil je niet onder tijdsdruk maken. Bedenk het nu.

  Bekijk onze website.
