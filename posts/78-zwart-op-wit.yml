onderwerp: "Vraag het zwart op wit"
linkedin: |
  "Ja hoor, wij vragen die toelating aan." Een belofte aan de telefoon is niets waard als het misgaat.

  Mail je uitleners drie vragen. Hebben jullie je Wtta-aanvraag ingediend? Wanneer? En informeren jullie ons direct over de uitkomst?

  Bewaar de antwoorden bij de gegevens van die leverancier. Een mail met datum laat in elk geval zien dat je erbovenop zat.

  Uiteindelijk telt het register van de NAU. Dat check je vanaf 1 juli zelf, en daarna regelmatig opnieuw. Een toelating kan ook weer worden ingetrokken.

  Het is administratie. Maar het is jouw administratie, want het is jouw verantwoordelijkheid.

  Bekijk onze website.
