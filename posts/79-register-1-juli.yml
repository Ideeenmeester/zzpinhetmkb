linkedin: |
  Over zeven weken kun je zien of jouw uitzendbureau het heeft gehaald. Ga jij kijken?

  Vanaf 1 juli 2027 is het register van de NAU openbaar. Daarin staat welke uitleners een toelating hebben, een ontheffing, of onder de overgangsregeling vallen.

  Dat register wordt je belangrijkste bron. Vanaf 2028 moet je kunnen laten zien dat je alleen inleent bij partijen die erin staan.

  Check niet alleen je grote bureaus, maar ook de kleine detacheerder en de payroller. Check op de juiste rechtspersoon, want veel bureaus werken met meerdere bv's. En check periodiek opnieuw.

  Hoe minder uitleners, hoe minder werk.

  Bekijk onze website.
