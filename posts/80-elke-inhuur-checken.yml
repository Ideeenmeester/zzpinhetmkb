onderwerp: "Elke inhuur, elke keer checken"
linkedin: |
  Vanaf 2028 krijgt je organisatie er een controlemoment bij. Bij elke inhuur.

  Nieuwe uitlener? Register checken. Nieuwe kracht via een bestaande uitlener? Checken of die toelating nog geldt. Lopende inhuur? Periodiek opnieuw, want een toelating kan worden ingetrokken.

  Wie het goed doet, legt die checks ook vast. Met datum. Zodat je bij een controle kunt laten zien dat je zorgvuldig was.

  Dat werk komt bij inkoop, HR of de afdelingsmanager te liggen. Bovenop de opslag die je al aan de tussenpartij betaalt.

  Stoppen met inlenen hoeft niet. Wel per functie kijken: moet dit via een uitlener, of kan het ook rechtstreeks?

  Bekijk onze website.
