linkedin: |
  Kijk je alleen naar het uurtarief van je bureau, dan mis je het grootste deel van de rekening.

  Daar komt bij: de tijd die je kwijt bent aan raamcontracten en leveranciersbeheer. Vanaf 2028 de controles op de Wtta-toelating. De risico's die toch bij jou blijven, zoals inlenersaansprakelijkheid. En de afhankelijkheid, die je pas voelt als het bureau zijn prijzen verhoogt of wegvalt.

  Tel je dat op, dan is het verschil met rechtstreeks samenwerken groter dan de opslag alleen.

  Rechtstreeks werken kost ook aandacht. Maar die tijd stop je in je eigen relaties, niet in het beheren van een tussenlaag.

  Bekijk onze website.
