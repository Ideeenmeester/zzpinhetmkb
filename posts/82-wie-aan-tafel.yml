onderwerp: "Als het misgaat, wie staat er dan?"
linkedin: |
  Bij een controle op je externe inzet zit niet je bureau aan tafel. Jij zit er.

  Misschien met de HR-manager of de controller ernaast. Maar het is jouw bedrijf dat wordt aangesproken.

  De uitlener zonder toelating. De zzp'er die eigenlijk werknemer bleek. De loonheffing die niet was afgedragen. Het komt allemaal bij jou terug.

  Dat is geen reden voor paniek. Wel een reden om zelf de regie te nemen. Weten met wie je werkt en hoe, en dat kunnen laten zien.

  Als je toch verantwoordelijk bent, regel het dan ook zelf. Goed, en zonder overbodige kosten.

  Bekijk onze website.
