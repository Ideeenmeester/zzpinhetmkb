onderwerp: "Angst is geen plan. Overzicht wel."
linkedin: |
  Boetes, naheffingen, aansprakelijkheid. Wie alleen bang is, maakt de verkeerde keuze.

  Angst leidt tot twee reacties. Je stopt helemaal met externe inzet en mist flexibiliteit en expertise. Of je steekt je kop in het zand en hoopt dat het goed gaat.

  Allebei kosten ze je geld.

  Het alternatief is overzicht. Weten welke externen er voor je werken, via welke route en op basis van welke afspraken. En per situatie kiezen voor de juiste vorm.

  Met dat overzicht zet je zelfstandigen met een gerust hart in. Rechtstreeks, zonder tussenpartij.

  Bekijk onze website.
