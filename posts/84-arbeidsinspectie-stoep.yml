onderwerp: "Stel: morgen staat de Arbeidsinspectie op de stoep"
linkedin: |
  Januari 2028. De Arbeidsinspectie staat voor de deur. Kun je binnen een uur laten zien bij wie je inleent?

  En dat die uitleners een toelating hebben? En welke zzp'ers er bij je werken, op basis van welke afspraken? De grens tussen inlenen en een opdracht is precies waar het om draait.

  Bij de meeste bedrijven begint dan het zoeken. Mails doorspitten, afdelingen bellen, facturen nalopen.

  Dat kun je nu nog voorkomen. Breng je externe inzet in kaart, leg het vast op één plek en houd het bij. Dan is een controle gewoon een afspraak. Geen crisis.

  Bekijk onze website.
