onderwerp: "De boete is niet het enige wat je kwijt bent"
linkedin: |
  De boete is niet het ergste wat de Wtta je kan kosten.

  Stel dat de uitlener waar je vijf mensen via inleent, geen toelating krijgt. Dan kun je die mensen vanaf 2028 niet meer op die manier inzetten. Projecten lopen vertraging op, klanten wachten, je team vangt het werk op.

  Of stel dat bij een controle blijkt dat je zzp'er eigenlijk werknemer was. Dan gaat het niet alleen om de naheffing, maar ook om de onrust, de tijd en het gedoe.

  Dat zijn kosten die op geen enkele factuur staan.

  Wie zijn externe inzet zelf regelt, met mensen die hij kent en afspraken die kloppen, heeft daar veel minder last van.

  Bekijk onze website.
