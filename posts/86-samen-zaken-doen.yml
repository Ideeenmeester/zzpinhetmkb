  Een ondernemer met een klus en een vakman die hem kan doen. Sinds wanneer zit daar standaard een bureau tussen?

  Ze spreken af wat er moet gebeuren, wat het kost en wanneer het klaar is. Ze leggen het vast. Het werk wordt gedaan, de factuur betaald. Zo gaat ondernemen al eeuwen.

  Ergens onderweg zijn we gaan geloven dat een tussenpartij nodig is. Voor de zekerheid. Die zekerheid blijkt kleiner dan gedacht, en de rekening groter.

  Zzpinhetmkb brengt het terug naar de basis. Rechtstreeks samenwerken, met overzicht en goede afspraken. Voor €9,99 per maand en €4,95 per lopende overeenkomst. De zzp'er betaalt niets.

  Bekijk onze website.
