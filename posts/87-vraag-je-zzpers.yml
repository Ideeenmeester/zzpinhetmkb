onderwerp: "Vraag het je zzp'ers zelf"
linkedin: |
  Vraag je zzp'er eens hoeveel het bureau van zijn tarief inhoudt. Grote kans dat je schrikt.

  Zelfstandigen die via een bureau werken, hebben daar vaak een uitgesproken mening over. Ze zijn ondernemer geworden om hun eigen koers te varen, en voelen zich soms meer uitzendkracht dan ondernemer.

  Rechtstreeks werken is voor hen aantrekkelijk. Ze houden meer over, hebben direct contact en meer regie over hun werk. Voor jou betekent het lagere kosten en een directe relatie.

  Kijk wel eerst in je contract met het bureau. Staat er een relatiebeding in, dan wil je dat weten.

  Bij zzpinhetmkb betaalt de zzp'er niets. Dat maakt de overstap makkelijk.

  Bekijk onze website.
