onderwerp: "Vijf punten: is het goed geregeld?"
linkedin: |
  Vijf vragen. Kun je ze alle vijf met ja beantwoorden, dan is je externe inzet goed geregeld.

  Weet je precies welke externen er voor je werken, via welke route en tegen welke kosten?

  Staat elke uitlener waar je mensen via inleent in het register van de NAU, en controleer je dat periodiek?

  Werken je zzp'ers op basis van een duidelijke opdracht met een resultaat?

  Bepalen ze zelf hoe ze werken, met eigen middelen en eigen ondernemersrisico?

  Kun je dit allemaal laten zien, op één plek?

  Eén keer nee is genoeg om nu te beginnen.

  Bekijk onze website.
