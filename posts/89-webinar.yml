linkedin: |
  Over zeven maanden mag je alleen nog inlenen bij toegelaten uitleners. Weet jij al wat dat voor jouw bedrijf betekent?

  De Belastingdienst handhaaft al op schijnzelfstandigheid. De Arbeidsinspectie gaat vanaf 1 januari 2028 handhaven op de Wtta. En veel ondernemers weten nog niet goed waar ze staan.

  Daarom organiseren we het webinar "Zzp in het mkb na 1 januari: wat verandert er en wat doe je nu?"

  We bespreken wat de Wtta voor jou als inlener betekent, hoe je inlenen en een opdracht uit elkaar houdt, en hoe je zzp'ers rechtstreeks en goed geregeld inzet. Praktisch, zonder juridisch jargon, met ruimte voor je vragen.

  De datum en het aanmeldformulier vind je op de website.

  Bekijk onze website.
