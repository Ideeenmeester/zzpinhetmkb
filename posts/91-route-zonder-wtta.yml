onderwerp: "Er is een route waarbij de Wtta niet eens speelt"
linkedin: |
  Er is een manier om externe mensen in te zetten waarbij de Wtta niet eens aan de orde komt.

  De Wtta gaat over inlenen: iemand werkt bij jou onder jouw leiding en toezicht, terwijl een andere partij hem ter beschikking stelt. Werkt een zzp'er echt zelfstandig, zonder gezag, dan leen je niet in. Dan is er ook geen toelating nodig.

  Dat is geen achterdeur. Zo is ondernemen met ondernemers bedoeld. Jij spreekt af wat er moet gebeuren, de zelfstandige bepaalt hoe.

  Met zzpinhetmkb richt je dat rechtstreeks in en leg je het goed vast. Zonder bureau ertussen en zonder zorgen over een uitlener die zijn toelating misschien niet haalt.

  Het kan gewoon.

  Bekijk onze website.
