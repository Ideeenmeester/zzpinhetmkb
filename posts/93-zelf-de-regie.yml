onderwerp: "Zelf de regie over je externe inzet"
linkedin: |
  Wie bepaalt eigenlijk wie er bij jou aan de slag gaat? Als het antwoord "het bureau" is, ben je de regie kwijt.

  Met zzpinhetmkb kies je zelf. Je werkt met zelfstandigen die je kent of die je via je eigen netwerk vindt. Je maakt rechtstreeks afspraken over de opdracht, het resultaat en de prijs.

  En je ziet alles op één plek. Wie er werkt, op basis van welke overeenkomst, wat het kost en of de papieren kloppen.

  Regie betekent niet dat je alles zelf moet uitzoeken. Het betekent dat jij de keuzes maakt, met overzicht en inzicht op je externe inzet.

  Bekijk onze website.
