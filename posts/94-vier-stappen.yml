onderwerp: "Rechtstreeks samenwerken in vier stappen"
linkedin: |
  Rechtstreeks werken met een zzp'er klinkt ingewikkelder dan het is. Het zijn vier stappen.

  Eén: scan je externe inzet. In drie minuten zie je waar je staat.

  Twee: omschrijf de opdracht. Wat moet er af, wanneer, en tegen welke prijs.

  Drie: sluit de overeenkomst rechtstreeks met de zzp'er. Hij bepaalt zelf hoe hij het werk aanpakt.

  Vier: houd het overzicht. KvK, certificaten, verzekeringen en de afspraken per opdracht staan in één dossier. Verloopt er iets, dan krijg je een seintje.

  Dat is het. Geen bureau, geen raamcontract, geen tussenpersoon die meeverdient.

  Bekijk onze website.
