onderwerp: "Opdrachtgever, geen inlener"
linkedin: |
  Je kunt inlener zijn. Of opdrachtgever. Dat verschil bepaalt hoeveel regels er op je bord liggen.

  Een inlener laat mensen onder zijn leiding en toezicht werken die door een andere partij ter beschikking worden gesteld. Daar hoort de Wtta bij, met toelating, register en controles.

  Een opdrachtgever geeft een zelfstandige een opdracht. De zelfstandige bepaalt hoe hij het doet, gebruikt zijn eigen middelen en draagt zijn eigen risico. Dan leen je niet in.

  Met zzpinhetmkb ben je opdrachtgever. Je legt per opdracht vast waarom het zelfstandig werk is, zodat je het ook kunt laten zien als iemand ernaar vraagt.

  Bekijk onze website.
