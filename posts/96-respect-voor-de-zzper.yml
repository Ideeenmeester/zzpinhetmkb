onderwerp: "Respect voor de zzp'er als ondernemer"
linkedin: |
  Een zzp'er is geen flexibele arbeidskracht. Het is een ondernemer.

  Toch wordt hij in veel constructies zo behandeld. Een bureau bepaalt zijn tarief, houdt een deel in en beslist mee over welke opdrachten hij krijgt. Dat schuurt, en het past ook slecht bij zelfstandigheid.

  Bij zzpinhetmkb staat de zzp'er naast de opdrachtgever, niet eronder. Hij maakt zijn eigen prijs. Hij bepaalt hoe hij het werk aanpakt. En hij betaalt niets voor deelname.

  Dat is niet alleen eerlijker. Het helpt ook om aan te tonen dat de samenwerking echt zelfstandig is. Respect voor de ondernemer en goed geregeld gaan hier hand in hand.

  Bekijk onze website.
