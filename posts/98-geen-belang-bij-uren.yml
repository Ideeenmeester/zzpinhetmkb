onderwerp: "Waarom wij geen belang hebben bij meer uren"
linkedin: |
  Een tussenpartij verdient meer als jouw zzp'er meer uren maakt. Wij niet.

  Dat klinkt als een detail, maar het verandert alles. Een bureau heeft er belang bij dat de opdracht lang duurt en dat er zoveel mogelijk uren worden geschreven. Logisch, want daar zit de marge.

  Wij rekenen per maand en per lopende overeenkomst. Of de zzp'er tien uur werkt of duizend, voor ons maakt dat niets uit.

  Daardoor kunnen we doen waar we voor zijn: zorgen dat de samenwerking goed geregeld is. Zonder commercieel belang bij hoe lang of hoe vaak.

  Bekijk onze website.
