onderwerp: "Een goede opdrachtomschrijving is het halve werk"
linkedin: |
  De beste bescherming tegen schijnzelfstandigheid kost niets. Het is een goede opdrachtomschrijving.

  Schrijf op wat er af moet zijn, niet hoeveel uur iemand komt. "Nieuwe voorraadmodule opgeleverd en getest voor 1 maart" zegt veel meer dan "drie dagen per week ondersteuning".

  Met een helder resultaat ligt het voor de hand dat de zelfstandige zelf bepaalt hoe hij daar komt. Dan stuur jij niet aan, en dan leen je ook niet in.

  In zzpinhetmkb leg je die omschrijving per opdracht vast. Op dezelfde plek als de overeenkomst en de rest van het dossier.

  Het halve werk is dan al gedaan.

  Bekijk onze website.
